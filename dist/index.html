<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#237b65"><title>Little Words · Baby flashcards</title><link rel="stylesheet" href="style.css"></head><body><main><header><a class="brand" href="./"><span>✿</span> little words</a><span class="tag">Look. Listen. Learn.</span></header><section class="intro"><span class="eyebrow">A LITTLE PLAY, A LITTLE LEARNING</span><h1>Big discoveries.<br>Little words.</h1><p>Tap a picture and say it together.</p></section><nav id="categories" aria-label="Card categories"></nav><section class="play" id="play" aria-label="Flashcards"><div class="fullscreen-tools"><button id="fullscreen" aria-pressed="false">⛶ &nbsp; Full screen</button><button id="exit-fullscreen" hidden aria-label="Exit full screen">✕ &nbsp; Close</button></div><div class="card-top"><span id="category">First words</span><span id="count"></span></div><button class="flashcard" id="card" aria-label="Hear the word"><span class="picture" id="picture" aria-hidden="true"></span><img id="image" alt="" hidden><span id="word"></span><span class="tap">◖)) &nbsp; Tap to hear</span></button><div id="segments" aria-live="polite"></div><div class="actions"><button id="hear" class="primary">◖)) &nbsp; Hear the word</button><button id="sound">Sound it out <span>· · ·</span></button></div><div class="navigation"><button id="prev" aria-label="Previous card">‹</button><span id="progress-label">One little word at a time</span><button id="next" aria-label="Next card">›</button></div><div class="progress"><div id="progress"></div></div></section><footer><span>Made for little moments together.</span><button id="shuffle">⤨ &nbsp; Mix it up</button></footer><p class="status" id="status" role="status"></p></main><script src="app.js" defer></script></body></html>
